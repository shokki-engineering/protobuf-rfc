name: Links

# Checks that every URL in docs/references.md resolves.
#
# That file is what CLAUDE.md points at instead of working from memory, so a
# rotted link there is worse than no link.
#
# Its own workflow rather than a step in Lint because this is the one gate
# that depends on the public internet: a failure here means a link rotted,
# never that the schema is wrong. Weekly as well as on change, because a link
# rots without anyone touching the repository.

on:
  pull_request:
    paths:
      - docs/references.md
      - .github/workflows/links.yml
  push:
    branches: [main]
    paths:
      - docs/references.md
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Links:
    name: Reference Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Private URLs are skipped: they 404 for an anonymous fetch by design.
      - name: Check Reference Links
        run: |
          bad=0
          while IFS= read -r url; do
            case "$url" in
              *github.com/the-protobuf-project/*|*buf.build/the-protobuf-project/*) continue ;;
            esac
            code=$(curl -o /dev/null -sL -w '%{http_code}' --max-time 20 "$url" || echo 000)
            case "$code" in
              200|301|302) ;;
              *) echo "::error file=docs/references.md::$code $url"; bad=1 ;;
            esac
          done < <(grep -oE 'https://[^ )<>|`]+' docs/references.md | sed 's/[.,]$//' | sort -u)
          if [ "$bad" -ne 0 ]; then
            echo "Fix or replace the links above."
            exit 1
          fi
          echo "All reference links resolve."
