name: Lint

# Everything that reads the schema without building anything from it: the two
# linters and the house rules. Split from the other workflows so a formatting
# slip reports as a formatting failure rather than somewhere inside a language
# matrix.
#
# Pull requests trigger it directly. A push to main runs it through main.yml,
# which needs it to pass before docs are regenerated or the module published --
# `needs` cannot reach across workflows, so main.yml calls this one instead.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Formatting is a gate, not a convenience: without it whichever editor
      # last opened a file decides how it wraps, and patches break underneath
      # whoever edits next.
      - name: Check Formatting
        run: buf format --diff --exit-code

      - name: Lint Protos
        run: buf lint

      - name: Build Descriptor Set
        run: buf build

      # Resolves buf.yaml deps itself, so googleapis and protovalidate are
      # available without a hand-built descriptor set. ignore-comment-disables
      # enforces CLAUDE.md rule 1: no rule may be disabled, including by an
      # inline comment inside a proto.
      - name: Lint API Design
        uses: the-protobuf-project/setup-google-api-linter@v1.1.0
        with:
          paths: protobuf/**/*.proto
          buf: true
          ignore-comment-disables: true
          output-format: github
          fail-on-error: true
          # Pinned because the action defaults to `latest`, and api-linter
          # v2.4.0 (2026-09-10) ships a single `api-linter.tar.gz` where every
          # release through v2.3.1 shipped per-platform assets. The action
          # builds the old URL and gets a 404. Unpin once the action handles
          # the new asset name.
          version: "2.3.1"

      # Apache-2.0 requires no per-file notice, but a file that quietly
      # loses one is how a repository ends up ambiguously licensed.
      - name: Check License Headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -3 "$file" | grep -q 'SPDX-License-Identifier: Apache-2.0'; then
              echo "::error file=$file::missing SPDX-License-Identifier header"
              missing=1
            fi
          done < <(find protobuf -name '*.proto')
          if [ "$missing" -ne 0 ]; then
            echo "Add the two-line Apache-2.0 header above 'syntax'."
            exit 1
          fi
          echo "All protos carry an SPDX header."

      # CLAUDE.md rule 2. A file over the cap gets split, never compressed.
      - name: Check File Length Cap
        run: |
          over=0
          while IFS= read -r file; do
            # Generated reference docs are exempt. Rule 2's remedy for an
            # oversized file is to split it, and a generated file cannot be
            # split by hand -- the same reasoning that exempts gen/. The
            # banner is written by tools/docs, so the exemption tracks the
            # generator rather than a path list that would drift from it.
            if head -8 "$file" | grep -qF 'Auto-generated by `protodoc`'; then
              continue
            fi
            lines=$(wc -l <"$file")
            if [ "$lines" -gt 250 ]; then
              echo "::error file=$file::$lines lines, over the 250-line cap"
              over=1
            fi
          done < <(find . -path ./gen -prune -o \( -name '*.proto' -o -name '*.md' \) -print)
          if [ "$over" -ne 0 ]; then
            echo "Split the files above; do not compress them."
            exit 1
          fi
          echo "All files within the 250-line cap."
