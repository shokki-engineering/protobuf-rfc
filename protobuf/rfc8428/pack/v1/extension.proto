syntax = "proto3";

package protobuf.rfc8428.pack.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";

option java_multiple_files = true;
option java_outer_classname = "ExtensionProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc8428.pack.v1";

// ExtensionField is one custom SenML Field, RFC 8428 section 4.4 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.4>.
//
// A label and its value, preserved verbatim. Two conventions ride in the
// label and neither is enforceable here, because both change what a *reader*
// must do rather than what a writer may send: a label beginning "b" has base
// semantics and applies to following records the way `base_unit` does
// (section 12.2 <https://www.rfc-editor.org/rfc/rfc8428.html#section-12.2>), and a label ending "_" is must-understand -- section 4.4 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.4>
// says a reader that does not know it MUST raise an error instead of ignoring
// it.
//
// Reference: RFC 8428 "Sensor Measurement Lists (SenML)", section 4.4.
// https://www.rfc-editor.org/rfc/rfc8428.html#section-4.4
message ExtensionField {
  // The SenML Label, section 12.2 <https://www.rfc-editor.org/rfc/rfc8428.html#section-12.2>, e.g. "bver_" or "myfield".
  //
  // Not called `name`, which would make api-linter treat this message as a
  // resource -- the same rename `ExtensionProperty.key` took in rfc5545.
  //
  // The pattern is section 11 <https://www.rfc-editor.org/rfc/rfc8428.html#section-11>'s CDDL, both alternatives: a base label is
  // "b" followed by one or more of the allowed characters, and a regular label
  // starts with any alphanumeric *except* lower-case "b", which is what keeps
  // the two apart.
  string label = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^(b[-_:.A-Za-z0-9]+|[A-Zac-z0-9][-_:.A-Za-z0-9]*)$"
  ];

  // The field's value. Section 11 <https://www.rfc-editor.org/rfc/rfc8428.html#section-11> allows a string, a number, a boolean or
  // binary data, and nothing else.
  oneof value {
    // A text value.
    string string_value = 2;

    // A numeric value.
    double number_value = 3;

    // A boolean value.
    bool boolean_value = 4;

    // Binary data, held decoded for the reason given on `Record.data_value`.
    bytes data_value = 5;
  }
}
