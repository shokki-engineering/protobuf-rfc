syntax = "proto3";

package protobuf.rfc8428.pack.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "protobuf/rfc8428/pack/v1/types.proto";

option java_multiple_files = true;
option java_outer_classname = "PackProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc8428.pack.v1";

// Pack is a SenML Pack: one or more SenML Records in an array,
// RFC 8428 section 4 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4>.
//
// The unit a sensor publishes and a consumer fetches. Section 12.3 <https://www.rfc-editor.org/rfc/rfc8428.html#section-12.3>
// registers four media types for it -- "application/senml+json",
// "application/senml+cbor", "application/senml+xml" and
// "application/senml-exi" -- which is the whole point of the format: one data
// model, four wire encodings, chosen by how constrained the device and the
// link are. The four are codecs registered against "the-protobuf-project.org/Pack" in
// `shared/interchange/v1`, not four schemas.
//
// A flat collection, "packs/{pack}". Section 4.7 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.7> is explicit that SenML
// carries the minimum dynamic information and that static metadata about the
// device or sensor is held **out of band**, by CoRE Link Format, so there is
// no device or sensor resource in this RFC to nest a pack under. Inventing one
// would assert a containment RFC 8428 <https://www.rfc-editor.org/rfc/rfc8428.html> deliberately declines to define -- the
// same reasoning that keeps `Resource` flat in rfc9073.
//
// What identifies a sensor is instead a *string*: `base_sensor_id` and
// `sensor_id` concatenated, which section 4.5.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.5.1> requires to be globally
// unique and constrains to characters usable directly in a URI path. Filter
// on it with AIP-160 <https://aip.dev/160> rather than looking for a parent in the resource name.
//
// Reference: RFC 8428 "Sensor Measurement Lists (SenML)", section 4.
// https://www.rfc-editor.org/rfc/rfc8428.html#section-4
message Pack {
  option (google.api.resource) = {
    type: "the-protobuf-project.org/Pack"
    pattern: "packs/{pack}"
    singular: "pack"
    plural: "packs"
  };

  // Resource name, "packs/{pack}".
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^packs/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Server-assigned unique id.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Base Version (bver), RFC 8428 section 4.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.1>. Defaults to 10 when unset.
  //
  // On the Pack rather than on `Record`, where the wire format puts it,
  // because section 4.4 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.4> requires every record in a Pack to carry the same
  // version and expects a producer to write it onto the first record only.
  // Hoisting it is lossless in both directions and removes the one place the
  // records could contradict each other. A serialiser writing resolved
  // records puts it back on each of them, per section 4.6 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.6>.
  //
  // Not a linear version. RFC 9100 <https://www.rfc-editor.org/rfc/rfc9100.html> reinterprets the number as a bitmap of
  // feature codes -- bit `c` set means feature `c` is in use -- so 10 is
  // 0b1010, the four reserved codes of the base specification, and 26 is that
  // plus RFC 8798 <https://www.rfc-editor.org/rfc/rfc8798.html>'s secondary units at code 4. A reader must therefore
  // compare bitwise and reject a pack asserting any bit it does not implement,
  // not compare magnitudes: RFC 9100 section 2.2 <https://www.rfc-editor.org/rfc/rfc9100.html#section-2.2> gives the case where an
  // implementation accepts 42 and rejects 26.
  //
  // The floor of 10 follows from that bitmap: RFC 9100 section 3 <https://www.rfc-editor.org/rfc/rfc9100.html#section-3> makes
  // codes 1 and 3 always present, so every legal version has both bits set.
  // int32, not uint32, per AIP-141 <https://aip.dev/141>.
  int32 base_version = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 10,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The records, in order, section 4 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4>.
  //
  // Order is load-bearing twice over: a base field applies to the records
  // *following* the one it appears in (section 4.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.1>), and a resolved pack
  // must additionally be in chronological order (section 4.6 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.6>). Reordering
  // this list changes what the pack means.
  //
  // At least one, from section 11 <https://www.rfc-editor.org/rfc/rfc8428.html#section-11>'s CDDL: `SenML-Pack = [1* record]`.
  repeated Record records = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.min_items = 1
  ];

  // Whether the stored records are resolved, section 4.6 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.6>.
  //
  // True when no record carries a base field other than Base Version, no time
  // is relative, and the records are in chronological order -- the normalised
  // form section 4.6 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.6> says big-data consumers and format converters want.
  //
  // Computed by the server from `records`, so it can never disagree with them,
  // and typed rather than derived per caller so that AIP-160 <https://aip.dev/160> can filter on it:
  // `resolved = true` is the natural query for an archive, and a filter cannot
  // see inside a repeated message field.
  bool resolved = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the pack was created.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the pack was last modified.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
  // update or delete to make the write conditional: if the pack changed since
  // it was read, the request fails instead of overwriting.
  string etag = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the pack was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted pack is purged for good. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp expire_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}
