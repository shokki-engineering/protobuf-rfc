syntax = "proto3";

package protobuf.rfc8428.sensor.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "SensorProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc8428.sensor.v1";

// Sensor is the thing a SenML Record names: what is being measured, and where
// to reach it.
//
// **Native: no RFC defines it, and under the rules of this repository that
// demands a reason rather than a citation.**
//
// The reason is that RFC 8428 names this gap and then declines to fill it.
// Section 4.5.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.5.1> requires the concatenated SenML name to be "a globally
// unique identifier for the resource" -- so the sensor has identity, in the
// RFC's own words. Section 4.7 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.7> then says SenML deliberately carries no
// static metadata about the device, object or sensor, "for efficiency
// reasons", and that such metadata "is carried out of band", pointing at the
// CoRE Link Format (RFC 6690 <https://www.rfc-editor.org/rfc/rfc6690.html>). A pack therefore tells you a reading came
// from "urn:dev:ow:10e2073a01080063" and nothing whatever about it.
//
// This resource is that out-of-band half, and it is **ours**. RFC 8428 defines
// a *name format* for a sensor, not a sensor.
//
// It sits under `rfc8428/` anyway, which is rule 5's one written exception --
// see `CLAUDE.md`. The rule keeps a native type out of an `rfc*/` directory so
// the path cannot lend it authority it has not earned, and that risk is real
// here: **nothing on this message comes from RFC 8428.** What outweighs it is
// that the resource is meaningless apart from SenML. Its identity field is a
// section 4.5.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.5.1> name, its unit is a section 12.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-12.1> unit, and the gap it
// fills is one section 4.7 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.7> names. Filed away from the packs it exists to
// annotate, it reads as a general-purpose sensor registry, which it is not.
// This comment is the substitute for the path: the authority is borrowed, and
// the borrowing is stated rather than implied.
//
// The fields below are the CoRE Link Format attributes section 4.7 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.7> points
// at, because inventing a different vocabulary for the same job would be
// worse than borrowing a specified one. Each cites RFC 6690 <https://www.rfc-editor.org/rfc/rfc6690.html>; none of that makes
// this message RFC 6690's, which defines a link serialisation and not a
// resource either.
//
// Not linked to `Pack` by a resource reference. A record names a sensor with
// a *string* -- `base_sensor_id` and `sensor_id` concatenated -- and that
// string is `senml_id` here. Joining the two is a lookup, not a foreign key,
// because a pack that arrives for an unregistered sensor is ordinary and must
// not be rejected.
message Sensor {
  option (google.api.resource) = {
    type: "the-protobuf-project.org/Sensor"
    pattern: "sensors/{sensor}"
    singular: "sensor"
    plural: "sensors"
  };

  // Resource name, "sensors/{sensor}".
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^sensors/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Server-assigned unique id.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The resolved SenML name this sensor answers to, RFC 8428 section 4.5.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.5.1>,
  // e.g. "urn:dev:ow:10e2073a01080063". Records match this by string.
  //
  // Rule 9's interchange-identity split, spelled `_id` rather than `_uid`
  // because SenML has no UID property: what carries identity here is the
  // Name, and AIP-140 <https://aip.dev/140> takes `id` for an identifier. It is IMMUTABLE for
  // rule 9's reason -- it arrives inside imported packs, is whatever the
  // originating system chose, and re-pointing it would silently re-attribute
  // every reading already stored against it.
  //
  // REQUIRED, where rule 9 makes an interchange identity optional, because
  // this resource exists to name one: a Sensor without it links to nothing
  // and is a row no pack can ever reach. The character set is section 4.5.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.5.1>'s,
  // applied to the whole concatenated name, which is what this field holds.
  string senml_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][-:./_A-Za-z0-9]*$"
  ];

  // What to call this sensor, e.g. "Boiler room thermometer".
  //
  // Named display_name, not name: AIP-122 <https://aip.dev/122> reserves `name` for the resource
  // identifier above.
  string display_name = 4 [(google.api.field_behavior) = OPTIONAL];

  // Where the sensor's SenML is fetched from: the link target of RFC 6690 <https://www.rfc-editor.org/rfc/rfc6690.html>
  // section 2 <https://www.rfc-editor.org/rfc/rfc6690.html#section-2>, e.g. "coap://[2001:db8::2]/3311/0" or "/sensors/temp".
  //
  // A URI reference, not an absolute URI: RFC 6690 <https://www.rfc-editor.org/rfc/rfc6690.html> link targets are commonly
  // relative to the host that served the link document, and requiring an
  // absolute form would reject the ordinary case.
  string target_uri = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.uri_ref = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Resource Type, the "rt=" link attribute, RFC 6690 section 3.1 <https://www.rfc-editor.org/rfc/rfc6690.html#section-3.1>, e.g.
  // "oic.r.temperature". What the thing *is*.
  //
  // Free text and repeated, because section 3.1 <https://www.rfc-editor.org/rfc/rfc6690.html#section-3.1> defines it as an opaque
  // space-separated list of values assigned by whoever deploys the sensor,
  // with no closed vocabulary to turn into an enum.
  repeated string resource_types = 6 [(google.api.field_behavior) = OPTIONAL];

  // Interface Description, the "if=" link attribute, RFC 6690 section 3.2 <https://www.rfc-editor.org/rfc/rfc6690.html#section-3.2>,
  // e.g. "core.s" for a sensor or "core.a" for an actuator. How the thing is
  // *talked to*, where `resource_types` says what it is. Free text for the
  // reason above.
  repeated string interface_descriptions = 7 [(google.api.field_behavior) = OPTIONAL];

  // The media types the sensor serves, e.g. "application/senml+cbor". This is
  // the "ct=" link attribute RFC 8428 section 4.7 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.7> names as the way a
  // resource advertises that it speaks SenML at all.
  //
  // RFC 6838 <https://www.rfc-editor.org/rfc/rfc6838.html> media type names, not the integers "ct=" actually carries. On a
  // constrained link the attribute holds a numeric CoAP Content-Format id --
  // RFC 8428 section 12.5 <https://www.rfc-editor.org/rfc/rfc8428.html#section-12.5> registers 110 to 113 and 320 to 323 for the eight
  // SenML types -- but those numbers mean nothing outside CoAP, and the codec
  // table in `shared/interchange/v1` is keyed on media type. Storing the
  // spelling that works in both places, and converting at the CoAP edge, beats
  // storing the one that works in neither.
  repeated string media_types = 8 [(google.api.field_behavior) = OPTIONAL];

  // The SenML unit the sensor reports in, RFC 8428 section 4.5.2 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.5.2>, e.g.
  // "Cel". A string for the reason `Record.unit` is one: section 12.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-12.1>'s
  // registry is IANA's and grows by expert review.
  //
  // Advisory, not authoritative. A record's own `unit` or the `base_unit` in
  // force decides what a reading means; this says what to *expect*, which is
  // what makes a wrong unit detectable rather than invisible.
  string unit = 9 [(google.api.field_behavior) = OPTIONAL];

  // How long a consumer should wait before a fresh reading, the Update Time of
  // RFC 8428 section 4.2 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.2> hoisted to the sensor that promises it. A longer
  // silence means the sensor or the path to it has failed.
  //
  // Here as well as on `Record` because the two answer different questions: on
  // a record it is what that reading claimed, and here it is what the sensor
  // is configured to deliver. Monitoring needs the second even when no record
  // has arrived -- which is exactly the case it exists to catch.
  google.protobuf.Duration update_duration = 10 [(google.api.field_behavior) = OPTIONAL];

  // When the sensor was registered.
  google.protobuf.Timestamp create_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the sensor was last modified.
  google.protobuf.Timestamp update_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
  // update or delete to make the write conditional: if the sensor changed
  // since it was read, the request fails instead of overwriting.
  string etag = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the sensor was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp delete_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted sensor is purged for good. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp expire_time = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}
