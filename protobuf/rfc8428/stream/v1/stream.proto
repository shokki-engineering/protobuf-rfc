syntax = "proto3";

package protobuf.rfc8428.stream.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "protobuf/rfc8428/stream/v1/types.proto";

option java_multiple_files = true;
option java_outer_classname = "StreamProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc8428.stream.v1";

// Stream is a Sensor Streaming Measurement List, RFC 8428 section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8>.
//
// The same records a Pack holds, collected over time instead of all at once.
// Section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8> registers four media types of its own for this --
// "application/sensml+json", "application/sensml+cbor",
// "application/sensml+xml" and "application/sensml-exi", section 12.3.2 <https://www.rfc-editor.org/rfc/rfc8428.html#section-12.3.2>
// onward -- and requires a system using SenML this way to say so, because a
// consumer may read each record as it arrives rather than waiting for the
// whole thing to close.
//
// **A separate resource from Pack, for one reason that is not cosmetic.**
// Section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8> resolves a relative time against when *that record* was
// sent, where a Pack resolves every relative time against when the pack was.
// A pack is one instant; a stream is one instant per record. Storing a stream
// as a Pack would collapse those into a single "now" and silently move every
// reading in it -- section 4.5.3 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.5.3> puts that error at anything from a
// millisecond to a dozen minutes. `StreamRecord` is where the per-record
// instant lives, and it is the whole reason this package exists.
//
// Reference: RFC 8428 "Sensor Measurement Lists (SenML)", section 4.8.
// https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8
message Stream {
  option (google.api.resource) = {
    type: "the-protobuf-project.org/Stream"
    pattern: "streams/{stream}"
    singular: "stream"
    plural: "streams"
  };

  // Resource name, "streams/{stream}".
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^streams/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Server-assigned unique id.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Base Version (bver), section 4.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.1>. Defaults to 10 when unset, and
  // hoisted off the records for the reason given on `Pack.base_version`:
  // section 4.4 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.4> requires one version for the whole list.
  //
  // Fixed for the life of the stream. A version is a bitmap of feature codes
  // under RFC 9100 <https://www.rfc-editor.org/rfc/rfc9100.html>, and a consumer reading records as they arrive has
  // already decided whether it understands those features -- changing them
  // mid-stream would invalidate that decision after the fact, for records it
  // has already acted on.
  int32 base_version = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).int32.gte = 10,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The records so far, in the order they were sent.
  //
  // Order is load-bearing three times over here: a base field applies to the
  // records following it (section 4.1 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.1>), a resolved list must be in
  // chronological order (section 4.6 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.6>), and section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8>'s "now" is the
  // moment each record was sent -- which only send order preserves.
  //
  // At least one, matching section 3 <https://www.rfc-editor.org/rfc/rfc8428.html#section-3>'s definition of a stream as "one or
  // more SenML Records". A stream is opened with its first record rather than
  // opened empty, which is also how section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8> describes one starting.
  repeated StreamRecord records = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.min_items = 1
  ];

  // Whether the stream has ended and accepts no further records.
  //
  // Native: section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8> describes a stream being sent and received
  // partially but never says how one finishes, because over a long-lived HTTP
  // POST the transport answers that and nothing needs to be written down. At
  // rest there is no transport to ask, and without this field an idle stream
  // and a finished one are indistinguishable -- which is the difference
  // between a sensor that has stopped reporting and one that was never
  // expected to report again.
  //
  // One-way. A closed stream cannot reopen: section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8> ties "now" to
  // send order, and appending after a gap would date the new records against
  // an instant the earlier ones were already resolved against.
  bool closed = 5 [(google.api.field_behavior) = OPTIONAL];

  // When the stream was opened.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the stream was last modified, which for a live stream is when its
  // last record arrived.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
  // update or delete to make the write conditional: if the stream changed
  // since it was read, the request fails instead of overwriting.
  //
  // Note that a live stream changes whenever a record is appended, so an etag
  // read from Get goes stale on its own. That is what makes it useful here --
  // an update racing an append fails rather than discarding the record.
  string etag = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the stream was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted stream is purged for good. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp expire_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StreamRecord is one record of a stream together with the instant it was
// sent, RFC 8428 section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8>.
//
// The pairing exists because section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8> says a relative time in a stream
// is read against "the time when the specific Record is sent in the stream".
// A `Record` alone cannot carry that: its own `time_value` is the offset being
// interpreted, not the instant to interpret it against.
//
// A wrapper rather than a field added to the copied `Record`, so the copy
// stays byte-identical to `protobuf.rfc8428.pack.v1.Record` and the two cannot
// drift. The difference between a pack and a stream then lives in exactly one
// place -- here -- which is where section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8> puts it too.
//
// Reference: RFC 8428 "Sensor Measurement Lists (SenML)", section 4.8.
// https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8
message StreamRecord {
  // The record itself, identical in every respect to a Pack's.
  Record record = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // When this record was sent, as POSIX seconds since the Unix epoch: the
  // "now" its relative times resolve against, section 4.8 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.8>.
  //
  // The server stamps its receive time when unset, which is the best available
  // answer and not always a good one -- section 4.5.3 <https://www.rfc-editor.org/rfc/rfc8428.html#section-4.5.3> puts the gap
  // between sending and receiving at up to a dozen minutes over a satellite
  // link. A producer that knows when it sent the record should say so.
  //
  // Named `_value` and typed double for the reason given on `Record.time_value`:
  // it is the same quantity on the same scale, and a Timestamp here would
  // silently disagree with the field it is being added to.
  double reference_time_value = 2 [(google.api.field_behavior) = OPTIONAL];
}
