syntax = "proto3";

package protobuf.rfc8428.unit.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "protobuf/rfc8428/unit/v1/unit.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc8428.unit.v1";

// Request message for Units.GetUnit, AIP-131 <https://aip.dev/131>.
message GetUnitRequest {
  // Name of the unit to retrieve, "units/{unit}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Unit",
    (buf.validate.field).string.pattern = "^units/[^/]+$"
  ];
}

// Request message for Units.ListUnits, AIP-132 <https://aip.dev/132>.
message ListUnitsRequest {
  // Maximum units to return. Defaults to 50, capped at 1000.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListUnitsResponse.next_page_token.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Include soft-deleted units in the result. AIP-164 <https://aip.dev/164>.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Units.ListUnits, AIP-132 <https://aip.dev/132>.
message ListUnitsResponse {
  // The units on this page.
  repeated Unit units = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Units.CreateUnit, AIP-133 <https://aip.dev/133>.
message CreateUnitRequest {
  // The unit to create.
  Unit unit = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last segment of the resource name. The
  // server generates one when empty.
  string unit_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Units.UpdateUnit, AIP-134 <https://aip.dev/134>.
message UpdateUnitRequest {
  // The unit to update. Its name field identifies the unit.
  Unit unit = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Units.DeleteUnit, AIP-135 <https://aip.dev/135>.
message DeleteUnitRequest {
  // Name of the unit to delete, "units/{unit}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Unit",
    (buf.validate.field).string.pattern = "^units/[^/]+$"
  ];
}

// Request message for Units.UndeleteUnit, AIP-164 <https://aip.dev/164>.
message UndeleteUnitRequest {
  // Name of the soft-deleted unit to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Unit",
    (buf.validate.field).string.pattern = "^units/[^/]+$"
  ];
}
